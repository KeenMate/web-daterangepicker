<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 verification — selection survival</title>
<style>
  body { font: 14px/1.4 system-ui; padding: 2rem; max-width: 720px; }
  pre { background: #f5f5f5; padding: .5rem .75rem; border-radius: 4px; }
  .pass { color: #16a34a; }
  .fail { color: #dc2626; font-weight: bold; }
</style>
</head>
<body>
<h1>Phase 4 — selection survives attribute changes</h1>
<p>Open the console; the script below programmatically sets a selection,
   then mutates several attributes and JS-property setters, and reports whether
   <code>selectedStartDate</code> / <code>selectedEndDate</code> still hold their values.</p>

<web-daterangepicker id="picker"
  selection-mode="range"
  date-format-mask="YYYY-MM-DD"
  visible-months-count="2"
  show-debug-info></web-daterangepicker>

<pre id="report">running…</pre>

<script type="module">
  import './src/index.ts';

  const el = document.getElementById('picker');
  const report = document.getElementById('report');
  const lines = [];
  const assert = (label, cond) => lines.push(`${cond ? '✓' : '✗'} ${label}`);

  // Wait for the element to be defined and connected.
  await customElements.whenDefined('web-daterangepicker');
  await new Promise(r => requestAnimationFrame(r));

  // Force a known selection state directly on the picker instance.
  const picker = el.picker;
  if (!picker) {
    report.textContent = 'FAIL: picker not initialized';
    throw new Error('picker not initialized');
  }
  picker.selectedStartDate = new Date(2026, 4, 10);
  picker.selectedEndDate = new Date(2026, 4, 20);
  picker.renderCalendar();
  picker.updateSummary();

  const startISO = picker.selectedStartDate.toISOString();
  const endISO = picker.selectedEndDate.toISOString();
  lines.push(`initial: start=${startISO.slice(0,10)} end=${endISO.slice(0,10)}`);

  // 1. Toggle a non-structural attribute — selection MUST survive.
  el.setAttribute('locale', 'de');
  await new Promise(r => requestAnimationFrame(r));
  assert('locale change preserves selectedStartDate', picker.selectedStartDate?.toISOString() === startISO);
  assert('locale change preserves selectedEndDate',   picker.selectedEndDate?.toISOString()   === endISO);

  // 2. min-date change — selection MUST survive.
  el.setAttribute('min-date', '2026-01-01');
  await new Promise(r => requestAnimationFrame(r));
  assert('min-date change preserves selectedStartDate', picker.selectedStartDate?.toISOString() === startISO);
  assert('min-date change preserves selectedEndDate',   picker.selectedEndDate?.toISOString()   === endISO);

  // 3. JS-property callback set — selection MUST survive.
  el.formatSummaryCallback = (data) => `${data.days} day(s)`;
  await new Promise(r => requestAnimationFrame(r));
  assert('formatSummaryCallback set preserves selectedStartDate', picker.selectedStartDate?.toISOString() === startISO);
  assert('formatSummaryCallback set preserves selectedEndDate',   picker.selectedEndDate?.toISOString()   === endISO);

  // 4. disabledDates JS property — selection MUST survive.
  el.disabledDates = ['2026-12-25'];
  await new Promise(r => requestAnimationFrame(r));
  assert('disabledDates set preserves selectedStartDate', picker.selectedStartDate?.toISOString() === startISO);
  assert('disabledDates set preserves selectedEndDate',   picker.selectedEndDate?.toISOString()   === endISO);

  // 5. show-today-button toggle — selection MUST survive.
  el.setAttribute('show-today-button', 'false');
  await new Promise(r => requestAnimationFrame(r));
  assert('show-today-button toggle preserves selection',
         picker.selectedStartDate?.toISOString() === startISO &&
         picker.selectedEndDate?.toISOString()   === endISO);

  // 6. Structural change — selection IS lost (full reinit). This documents the carve-out.
  el.setAttribute('visible-months-count', '3');
  // attributeChangedCallback for structural keys schedules a microtask reinit
  await new Promise(r => setTimeout(r, 0));
  await new Promise(r => requestAnimationFrame(r));
  // After structural reinit, picker may be a new instance — refresh ref.
  const picker2 = el.picker;
  assert('visible-months-count is correctly identified as structural (selection cleared)',
         picker2 !== picker);

  const passes = lines.filter(l => l.startsWith('✓')).length;
  const fails  = lines.filter(l => l.startsWith('✗')).length;
  report.innerHTML = lines.map(l =>
    l.startsWith('✓') ? `<span class="pass">${l}</span>` :
    l.startsWith('✗') ? `<span class="fail">${l}</span>` : l
  ).join('\n') + `\n\n${passes} pass, ${fails} fail`;
  console.log(`Phase 4 verify: ${passes} pass, ${fails} fail`);
</script>
</body>
</html>
