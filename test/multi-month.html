<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — multi-month layout</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        web-daterangepicker { display: block; max-width: 720px; }
    </style>
</head>
<body>
    <h1>multi-month layout</h1>
    <p>Targeted by <code>e2e/multi-month.spec.ts</code>. All pickers pinned to
       initial-date for deterministic months.</p>

    <div class="fixture">
        <div class="fixture-label">two months side-by-side, horizontal layout</div>
        <web-daterangepicker id="two-month" selection-mode="range"
            initial-date="2026-06-15" visible-months-count="2"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">2×3 grid (6 months)</div>
        <web-daterangepicker id="grid" selection-mode="range"
            initial-date="2026-06-15" visible-months-count="6"
            month-layout="grid" grid-rows="2" grid-columns="3"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">three months with unified navigation</div>
        <web-daterangepicker id="unified" selection-mode="range"
            initial-date="2026-06-15" visible-months-count="3"
            is-unified-navigation-enabled></web-daterangepicker>
    </div>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
