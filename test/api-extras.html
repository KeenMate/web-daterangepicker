<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — API extras: setters, messages, displayFormatMask</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        web-daterangepicker { display: block; max-width: 320px; }
    </style>
</head>
<body>
    <h1>API extras</h1>
    <p>Targeted by <code>e2e/api-extras.spec.ts</code>.</p>

    <div class="fixture">
        <div class="fixture-label">selectedDate setter (single mode)</div>
        <web-daterangepicker id="single-setter" selection-mode="single"
            initial-date="2026-06-15"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">selectedRanges setter (range mode)</div>
        <web-daterangepicker id="range-setter" selection-mode="range"
            initial-date="2026-06-15"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">showMessage / hideMessage</div>
        <web-daterangepicker id="messages" selection-mode="single"
            initial-date="2026-06-15"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">display-format-mask — localized hint fills the placeholder when no explicit placeholder is set</div>
        <web-daterangepicker id="display-mask-hint" selection-mode="single"
            date-format-mask="DD.MM.YYYY"
            display-format-mask="dd.mm.rrrr"></web-daterangepicker>
    </div>

    <div class="fixture">
        <div class="fixture-label">explicit placeholder wins over display-format-mask</div>
        <web-daterangepicker id="placeholder-wins" selection-mode="single"
            date-format-mask="DD.MM.YYYY"
            display-format-mask="dd.mm.rrrr"
            placeholder="Vyberte datum"></web-daterangepicker>
    </div>

    <script type="module" src="/src/index.ts"></script>
</body>
</html>
